<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${funcionario.id == null ? 'Nova funcionario' : 'Editar funcionario'} + ' | Loja Senac'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="mb-4">
                <h1 class="h3 mb-1" th:text="${funcionario.id == null ? 'Nova funcionario' : 'Editar funcionario'}"></h1>
                <p class="text-secondary mb-0">Preencha os dados da funcionario.</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/funcionarios/salvar}" th:object="${funcionario}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="nome">Nome</label>
                            <input id="nome" class="form-control"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                   type="text" th:field="*{nome}" maxlength="100" autofocus>
                            <div class="invalid-feedback" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="cpf">CPF</label>
                            <input id="cpf" class="form-control"
                                   th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                                   type="text" th:field="*{cpf}" maxlength="20">
                            <div class="invalid-feedback" th:errors="*{cpf}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="cargo">Cargo</label>
                            <input id="cargo" class="form-control"
                                   th:classappend="${#fields.hasErrors('cargo')} ? 'is-invalid'"
                                   type="text" th:field="*{cargo}" maxlength="40">
                            <div class="invalid-feedback" th:errors="*{cargo}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="setor">Setor</label>
                            <input id="setor" class="form-control"
                                   th:classappend="${#fields.hasErrors('setor')} ? 'is-invalid'"
                                   type="text" th:field="*{setor}" maxlength="40">
                            <div class="invalid-feedback" th:errors="*{setor}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="permicoes">Permissões</label>
                            <select id="permicoes" class="form-select"
                                    th:classappend="${#fields.hasErrors('permicoes')} ? 'is-invalid'"
                                    th:field="*{permicoes}">
                                <option value="ADM">ADM</option>
                                <option value="field">field</option>
                                <option value="tst">tst</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{permicoes}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="status">Status</label>
                            <select id="status" class="form-select"
                                    th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'"
                                    th:field="*{status}">
                                <option value="At">Ativo (At)</option>
                                <option value="Af">Afastado (Af)</option>
                                <option value="In">Inativo (In)</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{status}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="nRsText">NRs</label>
                            <input id="nRsText" class="form-control"
                                   th:classappend="${#fields.hasErrors('nRs')} ? 'is-invalid'"
                                   type="text" th:field="*{nRsText}"
                                   placeholder="Ex.: 06, 12, 35">
                            <div class="form-text">Separe as NRs por vírgula; cada valor pode ter até 15 caracteres.</div>
                            <div class="invalid-feedback" th:errors="*{nRs}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-success" type="submit">Salvar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/funcionarios}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
