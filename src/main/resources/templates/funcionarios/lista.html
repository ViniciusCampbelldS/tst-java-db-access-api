<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Funcionarios | Loja Senac</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Funcionarios</h1>
            <p class="text-secondary mb-0">Organize os epis por funcionario.</p>
        </div>

        <a class="btn btn-primary" th:href="@{/funcionarios/nova}">Nova funcionario</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="funcionario : ${funcionarios}">
                    <td th:text="${funcionario.id}"></td>
                    <td class="fw-semibold" th:text="${funcionario.nome}"></td>
                    <td th:text="${funcionario.descricao ?: '-'}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-outline-warning btn-sm"
                           th:href="@{/funcionarios/editar/{id}(id=${funcionario.id})}">
                            Editar
                        </a>

                        <form class="d-inline"
                              th:action="@{/funcionarios/excluir/{id}(id=${funcionario.id})}"
                              method="post"
                              onsubmit="return confirm('Deseja excluir esta funcionario?')">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(funcionarios)}">
                    <td colspan="4" class="text-center py-5 text-secondary">
                        Nenhuma funcionario cadastrada.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
