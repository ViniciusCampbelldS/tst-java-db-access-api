<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${epiForm.id == null ? 'Novo epi' : 'Editar epi'} + ' | Loja Senac'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="h3 mb-1" th:text="${epiForm.id == null ? 'Novo epi' : 'Editar epi'}"></h1>
                <p class="text-secondary mb-0">Preencha os dados e salve o cadastro.</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/epis/salvar}" th:object="${epiForm}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="ca">CA</label>
                            <input id="ca" class="form-control"
                                   th:classappend="${#fields.hasErrors('ca')} ? 'is-invalid'"
                                   type="text" th:field="*{ca}" maxlength="15">
                            <div class="invalid-feedback" th:errors="*{ca}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="nome">Nome</label>
                            <input id="nome" class="form-control"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                   type="text" th:field="*{nome}" maxlength="600" autofocus>
                            <div class="invalid-feedback" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="vencimento">Vencimento</label>
                            <input id="vencimento" class="form-control"
                                   th:classappend="${#fields.hasErrors('vencimento')} ? 'is-invalid'"
                                   type="date" th:field="*{vencimento}">
                            <div class="invalid-feedback" th:errors="*{vencimento}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="funcionarioIds">Funcionarios</label>
                            <select id="funcionarioIds" class="form-select" multiple size="5"
                                    th:classappend="${#fields.hasErrors('funcionarioIds')} ? 'is-invalid'"
                                    th:field="*{funcionarioIds}">
                                <option th:each="funcionario : ${funcionarios}"
                                        th:value="${funcionario.id}"
                                        th:text="${funcionario.nome}"></option>
                            </select>
                            <div class="form-text">Use Ctrl (Windows/Linux) ou Command (Mac) para selecionar várias.</div>
                            <div class="invalid-feedback" th:errors="*{funcionarioIds}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-success" type="submit">Salvar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/epis}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
