<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Epis | Loja Senac</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Epis</h1>
            <p class="text-secondary mb-0">Gerencie os epis cadastrados na loja.</p>
        </div>

        <a class="btn btn-primary" th:href="@{/epis/novo}">Novo epi</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>CA</th>
                    <th>Lote</th>
                    <th>Nome</th>
                    <th>Vencimento</th>
                    <th>Funcionarios</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="epi : ${epis}">
                    <td th:text="${epi.id}"></td>
                    <td th:text="${epi.ca}"></td>
                    <td th:text="${epi.lote}"></td>
                    <td class="fw-semibold" th:text="${epi.nome}"></td>
                    <td th:text="${#temporals.format(epi.vencimento, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:each="funcionario, status : ${epi.funcionarios}"
                              th:text="${funcionario.nome + (status.last ? '' : ', ')}"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-outline-warning btn-sm"
                           th:href="@{/epis/editar/{id}(id=${epi.id})}">
                            Editar
                        </a>

                        <form class="d-inline"
                              th:action="@{/epis/excluir/{id}(id=${epi.id})}"
                              method="post"
                              onsubmit="return confirm('Deseja excluir este epi?')">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(epis)}">
                    <td colspan="7" class="text-center py-5 text-secondary">
                        Nenhum epi cadastrado.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
